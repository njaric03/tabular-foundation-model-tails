# Lint, the tests of common/, and an import of every experiment script. The model packages
# are not installed: they need incompatible torch versions and a licence login, so the
# scripts that import them are skipped.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # matplotlib because the import test loads plot_dissociation.py
          python -m pip install -e ".[dev]" matplotlib

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: python -m pytest tests -q
